<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M&amp;U Deal Desk</title>
<meta name="description" content="Local, draft-only profitability and quoting desk for M&U Ventures.">
<style>
:root{--bg:#080808;--surface:#131313;--raised:#1b1a18;--ink:#f3efe6;--muted:#a8a294;--gold:#c7a35a;--gold-hi:#e4c887;--line:rgba(243,239,230,.12);--good:#9fc79a;--bad:#e8907a;--warn:#e6c07a;
--display:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,8,8,.94);backdrop-filter:blur(8px);z-index:5}
.brand{font-family:var(--display);font-size:24px;letter-spacing:-.01em;white-space:nowrap}.brand b{color:var(--gold);font-weight:600}.brand span{font-family:var(--sans);font-size:14px;color:var(--muted);margin-left:8px}
.back{color:var(--muted);font-size:13px;text-decoration:none;white-space:nowrap}.back:hover{color:var(--ink)}
.dealbar{display:flex;gap:8px;align-items:center;flex:1;min-width:0;flex-wrap:wrap}
.dealbar select{max-width:360px;min-width:0;flex:1}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.tag{background:rgba(199,163,90,.15);color:var(--gold-hi);border:1px solid rgba(199,163,90,.35);border-radius:999px;padding:1px 9px;font-size:12px}
.tabs{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
main{padding:20px;max-width:1440px;margin:0 auto}.card,.out,.form{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.cols .out{position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto;padding-right:2px}
.cols.quote{grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr)}
.single{max-width:1100px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field.wide{grid-column:1/-1}
label{font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[aria-invalid=true]{border-color:var(--bad)}
.inwrap{display:flex;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:10px}
.inwrap:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.inwrap input{border:0;background:none;outline:none}.affix{padding:0 0 0 10px;color:var(--muted);font-size:13px}.affix:last-child{padding:0 10px 0 0}
.check{display:flex;gap:9px;align-items:center;color:var(--ink);font-size:14px;cursor:pointer;padding-top:20px}.check input{width:18px;height:18px;accent-color:var(--gold);flex:none}.check.wide{grid-column:1/-1;padding-top:4px}
.hint{color:var(--muted);font-size:12px}.err{color:var(--bad);font-size:12px;min-height:0}.err:empty{display:none}
.row-edit{border-top:1px solid var(--line);padding:12px 0 10px;display:flex;flex-direction:column;gap:6px}.row-edit:first-of-type{border-top:0;padding-top:0}.row-edit button{align-self:flex-start}
button{cursor:pointer;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#17140f;padding:9px 14px;font-weight:600}
button.ghost{background:none;color:var(--ink);border-color:var(--line);font-weight:500}button.ghost:hover{border-color:var(--gold)}
button.small,.small>summary{padding:6px 10px;font-size:13px}
button.link{background:none;border:0;padding:0;color:var(--ink);text-align:left;font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}.menu summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;top:calc(100% + 6px);background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:230px;z-index:10;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu>div button,.filebtn{background:none;border:1px solid transparent;color:var(--ink);text-align:left;font-weight:500;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.menu>div button:hover,.filebtn:hover{border-color:var(--line)}.filebtn{position:relative}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.filebtn:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.stat{background:var(--raised);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12.5px;color:var(--muted)}.stat strong{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.stat small{font-size:12px;color:var(--muted)}
.stat.pos strong,.pos{color:var(--good)}.stat.neg strong,.neg{color:var(--bad)}.stat.warnbox strong{color:var(--warn)}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--raised);margin:8px 0}
.bar span{display:block;height:100%}.c1{background:#6f6a5e}.c2{background:#8a8577}.c3{background:#4f5c66}.c4{background:#5d4c6b}.gold{background:var(--gold)}.loss{background:var(--bad)}
.legend{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}.legend b{color:var(--ink);font-weight:500}
.callout{background:rgba(199,163,90,.08);border:1px solid rgba(199,163,90,.25);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-size:14px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}thead th{color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
th[scope=row]{font-weight:500}th small,td small{display:block;color:var(--muted);font-weight:400;font-size:12px}
tr.strong th,tr.strong td{font-weight:650}tfoot th,tfoot td{font-weight:650;border-bottom:0}tr.current th button{color:var(--gold-hi)}
table.inputs td{min-width:110px}table.inputs input{padding:7px 9px;text-align:right}
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.pkg{background:var(--raised);color:var(--ink);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:400}
.pkg b{font-size:15px}.pkg span{font-size:14px}.pkg small{color:var(--muted);font-size:12px}.pkg.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.offer-panel{margin:16px 20px}.conflict.offer{background:rgba(199,163,90,.1);border-color:rgba(199,163,90,.35)}
.conflict{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(232,144,122,.12);border-bottom:1px solid rgba(232,144,122,.4);padding:10px 20px;font-size:14px}.conflict[hidden]{display:none}button:disabled{opacity:.45;cursor:not-allowed}
.ok{color:var(--good)}.warn{color:var(--warn)}.muted{color:var(--muted)}p.small,.small{font-size:13px}
.flags,.unknowns{border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.flags{background:rgba(232,144,122,.08);border:1px solid rgba(232,144,122,.35)}.flags strong{color:var(--bad)}
.unknowns{background:rgba(230,192,122,.07);border:1px solid rgba(230,192,122,.3)}.unknowns strong{color:var(--warn)}
.flags ul,.unknowns ul{margin:6px 0 0;padding-left:18px}ul.plain{padding-left:18px;margin:0}ul.plain li{margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.preview.agreement{height:2350px;max-width:880px;display:block}.single.wide{max-width:900px}
.preview{width:100%;height:1200px;border:1px solid var(--line);border-radius:var(--r);background:#efe9dc}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.pass{background:rgba(159,199,154,.14);color:var(--good)}.badge.critical{background:rgba(232,144,122,.18);color:var(--bad)}.badge.warning{background:rgba(230,192,122,.15);color:var(--warn)}.badge.info{background:rgba(243,239,230,.08);color:var(--muted)}
a{color:var(--gold-hi)}
td{white-space:nowrap}td.small{white-space:normal}
@media (max-width:1020px){.cols,.cols.quote{grid-template-columns:minmax(0,1fr)}.cols .out{position:static;max-height:none;order:-1}.preview{height:900px}.top{position:static}.dealbar{order:3;flex-basis:100%}}
@media (max-width:640px){main{padding:14px 16px}.top{padding:12px 16px;gap:10px}.tabs{padding:6px 10px 0}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:17px}.pkgs{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.dealbar select{max-width:none;flex-basis:100%}.card{padding:14px}.menu>div{right:auto;left:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Loading the deal desk…</p></div>
<noscript><p style="padding:20px">The deal desk needs JavaScript.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
